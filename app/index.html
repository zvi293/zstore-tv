<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Zstore TV</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2.0.2">
</head>
<body>
<div id="boot"><div class="lg"><span style="animation-delay:.05s">Z</span><span style="animation-delay:.12s">S</span><span style="animation-delay:.19s">T</span><span style="animation-delay:.26s">O</span><span style="animation-delay:.33s">R</span><span style="animation-delay:.40s">E</span>&nbsp;<span class="a" style="animation-delay:.6s">T</span><span class="a" style="animation-delay:.68s">V</span></div><div class="bar"></div><div class="tg">המסך החכם של החדר</div></div>
<div class="toast" id="toast"></div>
<section class="screen on" id="s_home"><canvas class="full" id="c_home"></canvas>
  <div class="brand">ZSTORE <b>TV</b></div>
  <div class="h-top sh">
    <div><div class="greet" id="greet"></div><div class="clock" id="hClock">--:--</div><div class="dates"><span class="hd" id="hHeb"></span> · <span id="hGreg"></span></div><div class="chips" id="chips"></div></div>
    <div class="wx"><div class="wx-now" id="wxNow">--°</div><div class="wx-desc" id="wxDesc">פתח תקווה</div><div class="wx-days" id="wxDays"></div></div>
  </div>
  <div class="grid"><div class="rt">צפייה ואווירה</div><div class="row" id="row1"></div><div class="rt">החדר שלי</div><div class="row" id="row2"></div></div>
  <div class="hint">חיצים לבחירה · OK לפתיחה · מספרים לקיצור · חזור = בית</div>
</section>
<div id="screens"></div>
<script src="core.js?v=2.0.2"></script>
<script src="sky.js?v=2.0.2"></script>
<script src="scenes.js?v=2.0.2"></script>
<script src="scenes2.js?v=2.0.2"></script>
<script src="modes.js?v=2.0.2"></script>
<script src="modes2.js?v=2.0.2"></script>
<script src="trivia.js?v=2.0.2"></script>
<script src="home.js?v=2.0.2"></script>
<script>Z.init();</script>
</body>
</html>
