<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>Zstore TV</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;600;800&display=swap" rel="stylesheet">
<style>html,body{margin:0;background:#05060b;overflow:hidden}</style>
</head>
<body>
<div id="boot"><div class="lg"><span style="animation-delay:.05s">Z</span><span style="animation-delay:.12s">S</span><span style="animation-delay:.19s">T</span><span style="animation-delay:.26s">O</span><span style="animation-delay:.33s">R</span><span style="animation-delay:.40s">E</span>&nbsp;<span class="a" style="animation-delay:.6s">T</span><span class="a" style="animation-delay:.68s">V</span></div><div class="bar"></div><div class="tg">המסך החכם של החדר</div></div>
<div class="toast" id="toast"></div>
<div id="screens"></div>
<script>
/* Zstore TV loader: reads the current version from GitHub (5 min cache) and loads that exact tagged build from the CDN */
(function(){
var FILES=['core','sky','scenes','scenes2','modes','modes2','trivia','home'],done=false;
function go(base){var l=document.createElement('link');l.rel='stylesheet';l.href=base+'style.css';document.head.appendChild(l);
  var i=0;(function next(){if(i>=FILES.length){if(window.Z&&Z.init)Z.init();return}var s=document.createElement('script');s.src=base+FILES[i++]+'.js';s.onload=next;s.onerror=next;document.body.appendChild(s)})()}
function fallback(){if(done)return;done=true;go('')}
try{var x=new XMLHttpRequest();x.open('GET','https://raw.githubusercontent.com/zvi293/zstore-tv/main/version.json?t='+Date.now());x.timeout=5000;
  x.onload=function(){if(done)return;try{var v=JSON.parse(x.responseText).v;if(!v)throw 0;done=true;go('https://cdn.jsdelivr.net/gh/zvi293/zstore-tv@'+v+'/app/')}catch(e){fallback()}};
  x.onerror=fallback;x.ontimeout=fallback;x.send()}catch(e){fallback()}
setTimeout(fallback,7000);
})();
</script>
</body>
</html>
